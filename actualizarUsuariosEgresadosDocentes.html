<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISPE - Actualizar Usuarios, Egresados y Docentes</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ============================================================
           ESTILOS COMPLETOS Y MEJORADOS
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1e3c 0%, #1a3a6a 50%, #0a1e3c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 40px 45px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---- HEADER ---- */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }

        .header .icon {
            font-size: 36px;
            color: #0a1e3c;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            color: #0a1e3c;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            color: #4a9ad9;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle i {
            color: #4a9ad9;
        }

        /* ---- STATUS BAR ---- */
        .status {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-loading {
            background: #dbeafe;
            color: #1e40af;
            border-left: 5px solid #3b82f6;
        }

        .status-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 5px solid #10b981;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 5px solid #ef4444;
        }

        .status-warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 5px solid #f59e0b;
        }

        .status .status-icon {
            font-size: 20px;
        }

        /* ---- LOG ---- */
        .log-container {
            background: #0f172a;
            border-radius: 12px;
            padding: 4px 0;
            margin: 16px 0;
            border: 1px solid #1e293b;
        }

        .log {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 12px;
            max-height: 280px;
            overflow-y: auto;
            padding: 16px 20px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.8;
            color: #e2e8f0;
        }

        .log::-webkit-scrollbar {
            width: 5px;
        }
        .log::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .log::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .log .ok { color: #34d399; }
        .log .error { color: #f87171; }
        .log .info { color: #60a5fa; }
        .log .warning { color: #fbbf24; }
        .log .separator { color: #334155; }

        /* ---- BOTONES ---- */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0 16px;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-success {
            background: #059669;
            color: white;
        }
        .btn-success:hover {
            background: #047857;
        }

        .btn-purple {
            background: #7c3aed;
            color: white;
        }
        .btn-purple:hover {
            background: #6d28d9;
        }

        .btn-warning {
            background: #d97706;
            color: white;
        }
        .btn-warning:hover {
            background: #b45309;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: #475569;
        }
        .btn-outline:hover {
            border-color: #0a1e3c;
            color: #0a1e3c;
            background: #f8fafc;
        }

        .btn i {
            font-size: 15px;
        }

        /* ---- TABLA DE RESULTADOS ---- */
        #resultados {
            margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead th {
            background: #f1f5f9;
            text-align: left;
            padding: 12px 18px;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table tbody td {
            padding: 12px 18px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        table tbody tr:hover {
            background: #f8fafc;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        .table-count {
            display: inline-block;
            background: #0a1e3c;
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        /* ---- BADGE ---- */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-warning { background: #fef3c7; color: #92400e; }

        /* ---- FOOTER ---- */
        .footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.8;
        }

        .footer strong {
            color: #0a1e3c;
        }

        .footer .version {
            color: #4a9ad9;
            font-weight: 600;
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 640px) {
            .container {
                padding: 24px 20px;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 24px;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
            }

            .log {
                font-size: 11px;
                padding: 12px 14px;
                max-height: 200px;
            }

            .status {
                font-size: 13px;
                padding: 12px 16px;
            }

            .subtitle {
                font-size: 14px;
            }

            table thead th,
            table tbody td {
                padding: 10px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 16px 12px;
            }

            .header .icon {
                font-size: 28px;
            }
            .header h1 {
                font-size: 20px;
            }

            .log {
                font-size: 10px;
                max-height: 160px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="icon">📚</div>
            <h1>SISPE</h1>
        </div>
        <div class="subtitle">
            <i class="fas fa-sync-alt"></i>
            Actualizar Usuarios, Egresados y Docentes
            <span style="margin-left:auto;font-size:12px;color:#94a3b8;">
                <i class="fas fa-database"></i> SQLite
            </span>
        </div>

        <!-- STATUS -->
        <div id="status" class="status status-loading">
            <span class="status-icon">⏳</span>
            <span id="status-message">Inicializando...</span>
        </div>

        <!-- LOG -->
        <div class="log-container">

        </div>

        <!-- BOTONES -->
        <div class="btn-group">
            <button id="btn-actualizar" class="btn btn-success">
                <i class="fas fa-sync-alt"></i> Actualizar Todo
            </button>
            <button id="btn-ricardo" class="btn btn-purple">
                <i class="fas fa-chalkboard-teacher"></i> Ricardo (Docente)
            </button>
            <button id="btn-migdalia" class="btn btn-warning">
                <i class="fas fa-user-graduate"></i> Migdalia (Egresado)
            </button>
            <button id="btn-verificar" class="btn btn-primary">
                <i class="fas fa-search"></i> Verificar
            </button>
            <button id="btn-limpiar" class="btn btn-danger">
                <i class="fas fa-trash-alt"></i> Limpiar BD
            </button>
        </div>

        <!-- RESULTADOS -->
        <div id="resultados" style="display:none;">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-table"></i> Tabla</th>
                            <th style="text-align:right;"><i class="fas fa-hashtag"></i> Registros</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-resultados"></tbody>
                </table>
            </div>

        <!-- FOOTER -->
        <div class="footer">
            <div>
                <span class="version">SISPE v1.0</span>
                <span style="margin:0 8px;">·</span>
                <strong>UIJ</strong>
                <span style="margin:0 8px;">·</span>
                2026
            </div>
            <div style="font-size:12px;color:#cbd5e0;">
                <i class="fas fa-code"></i> Desarrollado por Ricardo Castillo Valdés
            </div>
        </div>
    </div>

    <!-- ============================================================
    CARGAR SQLITE
    ============================================================ -->
    <script src="lib/sql-wasm.js"></script>
    <script>
        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let db = null;
        let isReady = false;
        let SQL = null;

        // ============================================================
        // ELEMENTOS DOM
        // ============================================================
        const statusEl = document.getElementById('status');
        const statusMsg = document.getElementById('status-message');
        const logEl = document.getElementById('log');
        const btnActualizar = document.getElementById('btn-actualizar');
        const btnRicardo = document.getElementById('btn-ricardo');
        const btnMigdalia = document.getElementById('btn-migdalia');
        const btnVerificar = document.getElementById('btn-verificar');
        const btnLimpiar = document.getElementById('btn-limpiar');

        // ============================================================
        // FUNCIONES DE LOG
        // ============================================================
        function log(mensaje, tipo) {
            const prefix = {
                'ok': '✅ ',
                'error': '❌ ',
                'info': 'ℹ️ ',
                'warning': '⚠️ ',
                'separator': '━━━ '
            };
            const cls = {
                'ok': 'ok',
                'error': 'error',
                'info': 'info',
                'warning': 'warning',
                'separator': 'separator'
            };
            const line = (prefix[tipo] || '') + mensaje;
            logEl.innerHTML += `<span class="${cls[tipo] || 'info'}">${line}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(mensaje, tipo) {
            const tipos = {
                'loading': { cls: 'status-loading', icon: '⏳' },
                'success': { cls: 'status-success', icon: '✅' },
                'error': { cls: 'status-error', icon: '❌' },
                'warning': { cls: 'status-warning', icon: '⚠️' }
            };
            const t = tipos[tipo] || tipos['loading'];
            statusEl.className = 'status ' + t.cls;
            statusMsg.textContent = mensaje;
            statusEl.querySelector('.status-icon').textContent = t.icon;
        }

        // ============================================================
        // INICIALIZAR SQLITE
        // ============================================================
        function initSQLite() {
            return new Promise(function(resolve, reject) {
                // Verificar si existe initSqlJs
                if (typeof initSqlJs === 'undefined') {
                    log('⚠️ initSqlJs no está definido. Esperando carga...', 'warning');
                    let attempts = 0;
                    const maxAttempts = 20;
                    
                    function checkInit() {
                        attempts++;
                        if (typeof initSqlJs !== 'undefined') {
                            doInit();
                        } else if (attempts < maxAttempts) {
                            setTimeout(checkInit, 300);
                        } else {
                            reject(new Error('No se pudo cargar SQLite. Verifica que lib/sql-wasm.js existe.'));
                        }
                    }
                    checkInit();
                    return;
                }
                doInit();

                function doInit() {
                    log('📦 Cargando SQLite WebAssembly...', 'info');
                    
                    initSqlJs({
                        locateFile: function(filename) {
                            return 'lib/' + filename;
                        }
                    }).then(function(sqlModule) {
                        SQL = sqlModule;
                        db = new SQL.Database();
                        isReady = true;
                        log('✅ SQLite inicializado correctamente', 'ok');
                        setStatus('SQLite listo. Selecciona una opción.', 'success');
                        resolve();
                    }).catch(function(error) {
                        log('❌ Error al cargar SQLite: ' + error.message, 'error');
                        reject(error);
                    });
                }
            });
        }

        // ============================================================
        // EJECUTAR SQL
        // ============================================================
        function execSQL(sql) {
            return new Promise(function(resolve, reject) {
                if (!isReady || !db) {
                    reject(new Error('Base de datos no inicializada'));
                    return;
                }
                try {
                    db.run(sql);
                    resolve();
                } catch (error) {
                    reject(error);
                }
            });
        }

        function querySQL(sql) {
            return new Promise(function(resolve, reject) {
                if (!isReady || !db) {
                    reject(new Error('Base de datos no inicializada'));
                    return;
                }
                try {
                    const stmt = db.prepare(sql);
                    const results = [];
                    while (stmt.step()) {
                        results.push(stmt.getAsObject());
                    }
                    stmt.free();
                    resolve(results);
                } catch (error) {
                    reject(error);
                }
            });
        }

        // ============================================================
        // INSERTAR RICARDO
        // ============================================================
        async function insertarRicardoDocente() {
            if (!isReady) {
                setStatus('SQLite no inicializado', 'error');
                return;
            }

            setStatus('Insertando Ricardo como docente...', 'loading');
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'separator');
            log('👨‍🏫 Insertando Ricardo Castillo Valdés como DOCENTE...', 'info');

            try {
                const existe = await querySQL("SELECT * FROM docentes WHERE numero_identidad = '62020701509'");
                if (existe.length > 0) {
                    log('ℹ️ Ricardo ya existe en docentes', 'warning');
                    setStatus('ℹ️ Ricardo ya existe en docentes', 'success');
                    return;
                }

                await execSQL(`
                    INSERT INTO docentes (numero_identidad, nombre, apellidos, email_institucional, departamento, categoria_docente)
                    VALUES ('62020701509', 'Ricardo', 'Castillo Valdes', 'ricardo@uiij.co.cu', 'Informatica', 'Principal')
                `);
                log('✅ Ricardo Castillo Valdés insertado como DOCENTE', 'ok');
                log('   📧 ricardo@uiij.co.cu', 'info');
                log('   🏫 Departamento: Informatica', 'info');
                log('   🎓 Categoria: Principal', 'info');
                log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'separator');

                setStatus('✅ Ricardo insertado como docente', 'success');

            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================================
        // INSERTAR MIGDALIA
        // ============================================================
        async function insertarMigdaliaEgresado() {
            if (!isReady) {
                setStatus('SQLite no inicializado', 'error');
                return;
            }

            setStatus('Insertando Migdalia como egresado...', 'loading');
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'separator');
            log('👩‍🎓 Insertando Migdalia Utra Hernández como EGRESADO...', 'info');

            try {
                const existe = await querySQL("SELECT * FROM graduados WHERE numero_identidad = '12126509231'");
                if (existe.length > 0) {
                    log('ℹ️ Migdalia ya existe en graduados', 'warning');
                    setStatus('ℹ️ Migdalia ya existe en graduados', 'success');
                    return;
                }

                await execSQL(`
                    INSERT INTO graduados (numero_identidad, nombre, apellidos, carrera_id, anio_graduacion, email_institucional)
                    VALUES ('12126509231', 'Migdalia', 'Utra Hernandez', 2, 2024, 'migdalia@uiij.co.cu')
                `);
                log('✅ Migdalia Utra Hernández insertada como EGRESADO', 'ok');
                log('   📧 migdalia@uiij.co.cu', 'info');
                log('   🎓 Carrera: Lic. Contabilidad (ID: 2)', 'info');
                log('   📅 Año: 2024', 'info');
                log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'separator');

                setStatus('✅ Migdalia insertada como egresado', 'success');

            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================================
        // ACTUALIZAR TODO
        // ============================================================
        async function actualizarTodo() {
            if (!isReady) {
                setStatus('SQLite no inicializado', 'error');
                return;
            }

            setStatus('Actualizando todo...', 'loading');
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'separator');
            log('🔄 ACTUALIZANDO TODOS LOS DATOS', 'info');

            try {
                await insertarRicardoDocente();
                await insertarMigdaliaEgresado();
                await verificarBD();

                log('✅ ACTUALIZACION COMPLETADA', 'ok');
                setStatus('✅ Actualización completada', 'success');

            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================================
        // VERIFICAR BD
        // ============================================================
        async function verificarBD() {
            if (!isReady) {
                setStatus('SQLite no inicializado', 'error');
                return;
            }

            setStatus('Verificando base de datos...', 'loading');
            log('🔍 Verificando base de datos...', 'info');

            try {
                const tablas = ['roles', 'usuarios', 'entidades', 'carreras', 'graduados', 'docentes', 'egresados', 'tutores'];
                let html = '';
                let totalRegistros = 0;

                for (const tabla of tablas) {
                    const result = await querySQL(`SELECT COUNT(*) as total FROM ${tabla}`);
                    const count = result[0]?.total || 0;
                    totalRegistros += count;
                    html += `<tr>
                        <td><strong>${tabla}</strong></td>
                        <td style="text-align:right;"><span class="badge badge-info">${count}</span></td>
                    </tr>`;
                    log(`   📊 ${tabla}: ${count} registros`, 'info');
                }

                // Agregar total
                html += `<tr style="background:#f1f5f9;font-weight:700;">
                    <td><i class="fas fa-calculator"></i> <strong>TOTAL</strong></td>
                    <td style="text-align:right;"><span class="table-count">${totalRegistros}</span></td>
                </tr>`;

                document.getElementById('tabla-resultados').innerHTML = html;
                document.getElementById('resultados').style.display = 'block';

                // Verificar específicamente a Ricardo y Migdalia
                const ricardo = await querySQL("SELECT * FROM docentes WHERE numero_identidad = '62020701509'");
                const migdalia = await querySQL("SELECT * FROM graduados WHERE numero_identidad = '12126509231'");

                if (ricardo.length > 0) {
                    log('✅ Ricardo encontrado en DOCENTES', 'ok');
                } else {
                    log('❌ Ricardo NO encontrado en DOCENTES', 'error');
                }

                if (migdalia.length > 0) {
                    log('✅ Migdalia encontrada en GRADUADOS', 'ok');
                } else {
                    log('❌ Migdalia NO encontrada en GRADUADOS', 'error');
                }

                setStatus(`✅ Verificación completada: ${totalRegistros} registros en ${tablas.length} tablas`, 'success');

            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================================
        // LIMPIAR BD
        // ============================================================
        async function limpiarBD() {
            if (!isReady) {
                setStatus('SQLite no inicializado', 'error');
                return;
            }

            if (!confirm('⚠️ ¿Estás seguro de que quieres limpiar TODOS los datos?\nEsta acción no se puede deshacer.')) {
                return;
            }

            if (!confirm('⚠️ ¿REALMENTE quieres eliminar TODOS los datos de la base de datos?')) {
                return;
            }

            setStatus('Limpiando base de datos...', 'loading');
            log('🗑️ LIMPIANDO BASE DE DATOS...', 'warning');

            try {
                await execSQL('DELETE FROM notificaciones');
                await execSQL('DELETE FROM evaluaciones');
                await execSQL('DELETE FROM tutorias');
                await execSQL('DELETE FROM acciones_plan');
                await execSQL('DELETE FROM planes_superacion');
                await execSQL('DELETE FROM egresados');
                await execSQL('DELETE FROM tutores');
                await execSQL('DELETE FROM graduados');
                await execSQL('DELETE FROM docentes');
                await execSQL('DELETE FROM directivos');
                await execSQL('DELETE FROM coordinadores');
                await execSQL('DELETE FROM entidades');
                await execSQL('DELETE FROM usuarios');
                await execSQL('DELETE FROM roles');
                await execSQL("DELETE FROM sqlite_sequence");

                log('✅ Todos los datos eliminados', 'ok');
                log('💡 Para restaurar, ejecuta "Crear Base de Datos" desde el otro archivo', 'warning');
                setStatus('✅ Base de datos limpiada', 'success');

                document.getElementById('resultados').style.display = 'none';

            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        async function init() {
            log('🚀 Inicializando SISPE Updater...', 'info');
            setStatus('Inicializando SQLite...', 'loading');

            try {
                await initSQLite();
                log('✅ SQLite inicializado correctamente', 'ok');
                log('📌 Opciones disponibles:', 'info');
                log('   🔄 Actualizar Todo - Inserta Ricardo y Migdalia', 'info');
                log('   👨‍🏫 Ricardo - Solo inserta a Ricardo como docente', 'info');
                log('   👩‍🎓 Migdalia - Solo inserta a Migdalia como egresado', 'info');
                log('   🔍 Verificar - Muestra el estado de la base de datos', 'info');
                log('   🗑️ Limpiar BD - Elimina TODOS los datos', 'warning');

            } catch (error) {
                log(`❌ Error al inicializar: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        btnActualizar.addEventListener('click', actualizarTodo);
        btnRicardo.addEventListener('click', insertarRicardoDocente);
        btnMigdalia.addEventListener('click', insertarMigdaliaEgresado);
        btnVerificar.addEventListener('click', verificarBD);
        btnLimpiar.addEventListener('click', limpiarBD);

        // ============================================================
        // INICIO
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
