<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISPE - Gestor de Base de Datos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a1e3c 0%, #1a3a6a 50%, #0a1e3c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 950px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 40px 45px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }
        .header .icon { font-size: 36px; color: #0a1e3c; }
        .header h1 { font-size: 30px; font-weight: 800; color: #0a1e3c; letter-spacing: -0.5px; }
        .header h1 span { color: #4a9ad9; }
        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .subtitle i { color: #4a9ad9; }
        .subtitle .badge-db {
            margin-left: auto;
            background: #0a1e3c;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-loading { background: #dbeafe; color: #1e40af; border-left: 5px solid #3b82f6; }
        .status-success { background: #d1fae5; color: #065f46; border-left: 5px solid #10b981; }
        .status-error { background: #fee2e2; color: #991b1b; border-left: 5px solid #ef4444; }
        .status-warning { background: #fef3c7; color: #92400e; border-left: 5px solid #f59e0b; }
        .status .status-icon { font-size: 20px; }
        .log-container {
            background: #0f172a;
            border-radius: 12px;
            padding: 4px 0;
            margin: 16px 0;
            border: 1px solid #1e293b;
        }
        .log {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 16px 20px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.8;
            color: #e2e8f0;
        }
        .log::-webkit-scrollbar { width: 5px; }
        .log::-webkit-scrollbar-track { background: #1e293b; }
        .log::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .log .ok { color: #34d399; }
        .log .error { color: #f87171; }
        .log .info { color: #60a5fa; }
        .log .warning { color: #fbbf24; }
        .log .separator { color: #334155; }
        .log .highlight { color: #f472b6; font-weight: 700; }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0 16px;
            justify-content: center;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-success { background: #059669; color: white; }
        .btn-success:hover { background: #047857; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #475569; color: white; }
        .btn-secondary:hover { background: #334155; }
        .btn-warning { background: #d97706; color: white; }
        .btn-warning:hover { background: #b45309; }
        .btn i { font-size: 15px; }
        #resultados { margin-top: 20px; animation: fadeIn 0.4s ease; }
        .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table thead th {
            background: #f1f5f9;
            text-align: left;
            padding: 10px 14px;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        table tbody td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        table tbody tr:hover { background: #f8fafc; }
        table tbody tr:last-child td { border-bottom: none; }
        .table-count {
            display: inline-block;
            background: #0a1e3c;
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-purple { background: #e9d5ff; color: #6b21a8; }
        .footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.8;
        }
        .footer strong { color: #0a1e3c; }
        .footer .version { color: #4a9ad9; font-weight: 600; }
        @media (max-width: 640px) {
            .container { padding: 24px 20px; border-radius: 16px; }
            .header h1 { font-size: 24px; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; justify-content: center; padding: 14px 20px; }
            .log { font-size: 11px; padding: 12px 14px; max-height: 200px; }
            .subtitle .badge-db { margin-left: 0; width: 100%; text-align: center; }
        }
        @media (max-width: 400px) {
            .container { padding: 16px 12px; }
            .header .icon { font-size: 28px; }
            .header h1 { font-size: 20px; }
            .log { font-size: 10px; max-height: 160px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="icon">📚</div>
            <h1>SISPE</h1>
        </div>
        <div class="subtitle">
            <i class="fas fa-database"></i>
            Gestor de Base de Datos
            <span style="margin-left:auto;font-size:12px;color:#94a3b8;">
                <i class="fas fa-code"></i> SQLite
            </span>
            <span class="badge-db">
                <i class="fas fa-circle" style="color:#10b981;font-size:8px;"></i>
                v4.0
            </span>
        </div>

        <div id="status" class="status status-loading">
            <span class="status-icon">⏳</span>

        </div>

        <div class="log-container">

        </div>

        <div class="btn-group">
            <button id="btn-crear" class="btn btn-success">
                <i class="fas fa-database"></i> Crear BD Completa
            </button>
            <button id="btn-limpiar" class="btn btn-danger">
                <i class="fas fa-trash-alt"></i> Limpiar y Recrear BD
            </button>
            <button id="btn-verificar" class="btn btn-primary">

        <div id="resultados" style="display:none;">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-table"></i> Tabla</th>
                            <th style="text-align:right;"><i class="fas fa-hashtag"></i> Registros</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-resultados"></tbody>
                </table>

        </div>

        <div class="footer">
            <div>
                <span class="version">SISPE v4.0</span>
                <span style="margin:0 8px;">·</span>
                <strong>UIJ</strong>
                <span style="margin:0 8px;">·</span>
                2026
            </div>
            <div style="font-size:12px;color:#cbd5e0;">
                <i class="fas fa-code"></i> Desarrollado por Ricardo Castillo Valdés
            </div>
        </div>
    </div>

    <script src="lib/sql-wasm.js"></script>
    <script>
        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let db = null;
        let isReady = false;
        let SQL = null;

        const statusEl = document.getElementById('status');
        const statusMsg = document.getElementById('status-message');
        const logEl = document.getElementById('log');
        const btnCrear = document.getElementById('btn-crear');
        const btnLimpiar = document.getElementById('btn-limpiar');
        const btnVerificar = document.getElementById('btn-verificar');
        const btnDescargar = document.getElementById('btn-descargar');

        function log(mensaje, tipo) {
            const prefix = { 'ok': '✅ ', 'error': '❌ ', 'info': 'ℹ️ ', 'warning': '⚠️ ', 'separator': '━━━ ', 'highlight': '⭐ ' };
            const cls = { 'ok': 'ok', 'error': 'error', 'info': 'info', 'warning': 'warning', 'separator': 'separator', 'highlight': 'highlight' };
            logEl.innerHTML += `<span class="${cls[tipo] || 'info'}">${(prefix[tipo] || '') + mensaje}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(mensaje, tipo) {
            const tipos = {
                'loading': { cls: 'status-loading', icon: '⏳' },
                'success': { cls: 'status-success', icon: '✅' },
                'error': { cls: 'status-error', icon: '❌' },
                'warning': { cls: 'status-warning', icon: '⚠️' }
            };
            const t = tipos[tipo] || tipos['loading'];
            statusEl.className = 'status ' + t.cls;
            statusMsg.textContent = mensaje;
            statusEl.querySelector('.status-icon').textContent = t.icon;
        }

        function initSQLite() {
            return new Promise(function(resolve, reject) {
                if (typeof initSqlJs === 'undefined') {
                    let attempts = 0;
                    const maxAttempts = 20;
                    function checkInit() {
                        attempts++;
                        if (typeof initSqlJs !== 'undefined') { doInit(); }
                        else if (attempts < maxAttempts) { setTimeout(checkInit, 300); }
                        else { reject(new Error('No se pudo cargar SQLite. Verifica que lib/sql-wasm.js existe.')); }
                    }
                    checkInit();
                    return;
                }
                doInit();

                function doInit() {
                    log('📦 Cargando SQLite WebAssembly...', 'info');
                    initSqlJs({ locateFile: function(filename) { return 'lib/' + filename; } })
                        .then(function(sqlModule) {
                            SQL = sqlModule;
                            db = new SQL.Database();
                            isReady = true;
                            log('✅ SQLite inicializado correctamente', 'ok');
                            setStatus('SQLite listo. Selecciona una opción.', 'success');
                            resolve();
                        })
                        .catch(function(error) {
                            log('❌ Error al cargar SQLite: ' + error.message, 'error');
                            reject(error);
                        });
                }
            });
        }

        function execSQL(sql) {
            return new Promise(function(resolve, reject) {
                if (!isReady || !db) { reject(new Error('Base de datos no inicializada')); return; }
                try { db.run(sql); resolve(); }
                catch (error) { reject(error); }
            });
        }

        function querySQL(sql) {
            return new Promise(function(resolve, reject) {
                if (!isReady || !db) { reject(new Error('Base de datos no inicializada')); return; }
                try {
                    const stmt = db.prepare(sql);
                    const results = [];
                    while (stmt.step()) { results.push(stmt.getAsObject()); }
                    stmt.free();
                    resolve(results);
                } catch (error) { reject(error); }
            });
        }

        // ============================================================
        // CREAR BASE DE DATOS COMPLETA
        // ============================================================
        async function crearBDCompleta(limpiarPrimero) {
            if (!isReady) { setStatus('SQLite no inicializado', 'error'); return; }

            btnCrear.disabled = true;
            btnLimpiar.disabled = true;
            setStatus('Creando base de datos completa...', 'loading');
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'separator');
            log('⭐ CREANDO BASE DE DATOS COMPLETA v4.0', 'highlight');
            
            let tablasCreadas = 0;
            let registrosInsertados = 0;
            const startTime = Date.now();

            try {
                // ============================================================
                // LIMPIAR BASE DE DATOS SI SE SOLICITA
                // ============================================================
                if (limpiarPrimero) {
                    log('🗑️ Limpiando base de datos existente...', 'warning');
                    try {
                        const tables = await querySQL("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'");
                        for (const t of tables) {
                            await execSQL(`DROP TABLE IF EXISTS ${t.name}`);
                            log(`   ✅ Tabla ${t.name} eliminada`, 'info');
                        }
                        log('✅ Base de datos limpiada correctamente', 'ok');
                    } catch (e) {
                        log('⚠️ No se pudieron eliminar todas las tablas: ' + e.message, 'warning');
                    }
                }

                // ============================================================
                // TABLAS PRINCIPALES (1-20)
                // ============================================================
                log('📋 Creando tablas principales...', 'info');

                // 1. roles
                await execSQL(`CREATE TABLE IF NOT EXISTS roles (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    nombre TEXT UNIQUE NOT NULL,
                    descripcion TEXT,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP
                );`); tablasCreadas++;

                // 2. usuarios
                await execSQL(`CREATE TABLE IF NOT EXISTS usuarios (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    username TEXT UNIQUE NOT NULL,
                    password TEXT NOT NULL,
                    email TEXT UNIQUE NOT NULL,
                    nombre TEXT NOT NULL,
                    apellidos TEXT,
                    rol_id INTEGER NOT NULL,
                    activo BOOLEAN DEFAULT 1,
                    verificado BOOLEAN DEFAULT 0,
                    ultimo_acceso DATETIME,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME,
                    FOREIGN KEY (rol_id) REFERENCES roles(id)
                );`); tablasCreadas++;

                // 3. entidades
                await execSQL(`CREATE TABLE IF NOT EXISTS entidades (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    nombre TEXT NOT NULL,
                    sector TEXT,
                    direccion TEXT,
                    telefono TEXT,
                    email_contacto TEXT,
                    representante TEXT,
                    logo TEXT,
                    convenio_fecha_inicio DATE,
                    convenio_fecha_fin DATE,
                    convenio_estado TEXT DEFAULT 'activo',
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME
                );`); tablasCreadas++;

                // 4. carreras
                await execSQL(`CREATE TABLE IF NOT EXISTS carreras (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    nombre TEXT UNIQUE NOT NULL,
                    codigo TEXT UNIQUE,
                    descripcion TEXT,
                    duracion_anios INTEGER DEFAULT 5,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME
                );`); tablasCreadas++;

                // 5. graduados
                await execSQL(`CREATE TABLE IF NOT EXISTS graduados (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    numero_identidad TEXT UNIQUE NOT NULL,
                    nombre TEXT NOT NULL,
                    apellidos TEXT NOT NULL,
                    carrera_id INTEGER NOT NULL,
                    anio_graduacion INTEGER NOT NULL,
                    email_institucional TEXT,
                    titulo_oro BOOLEAN DEFAULT 0,
                    graduado_integral BOOLEAN DEFAULT 0,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    FOREIGN KEY (carrera_id) REFERENCES carreras(id)
                );`); tablasCreadas++;

                // 6. docentes (incluye investigadores del proyecto)
                await execSQL(`CREATE TABLE IF NOT EXISTS docentes (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    numero_identidad TEXT UNIQUE NOT NULL,
                    nombre TEXT NOT NULL,
                    apellidos TEXT NOT NULL,
                    email_institucional TEXT,
                    departamento TEXT,
                    categoria_docente TEXT,
                    categoria_cientifica TEXT,
                    es_investigador_proyecto BOOLEAN DEFAULT 0,
                    rol_proyecto TEXT,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP
                );`); tablasCreadas++;

                // 7. tutores
                await execSQL(`CREATE TABLE IF NOT EXISTS tutores (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    usuario_id INTEGER UNIQUE NOT NULL,
                    docente_id INTEGER,
                    entidad_id INTEGER NOT NULL,
                    categoria TEXT,
                    especialidad TEXT,
                    anios_experiencia INTEGER,
                    max_egresados INTEGER DEFAULT 5,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME,
                    FOREIGN KEY (usuario_id) REFERENCES usuarios(id),
                    FOREIGN KEY (docente_id) REFERENCES docentes(id),
                    FOREIGN KEY (entidad_id) REFERENCES entidades(id)
                );`); tablasCreadas++;

                // 8. egresados
                await execSQL(`CREATE TABLE IF NOT EXISTS egresados (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    usuario_id INTEGER UNIQUE NOT NULL,
                    carrera_id INTEGER NOT NULL,
                    entidad_id INTEGER NOT NULL,
                    tutor_id INTEGER,
                    anio_graduacion INTEGER,
                    titulo_oro BOOLEAN DEFAULT 0,
                    graduado_integral BOOLEAN DEFAULT 0,
                    proyecto_investigacion TEXT,
                    premios_cientificos TEXT,
                    intereses_profesionales TEXT,
                    areas_mejora TEXT,
                    avatar TEXT,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME,
                    FOREIGN KEY (usuario_id) REFERENCES usuarios(id),
                    FOREIGN KEY (carrera_id) REFERENCES carreras(id),
                    FOREIGN KEY (entidad_id) REFERENCES entidades(id),
                    FOREIGN KEY (tutor_id) REFERENCES tutores(id)
                );`); tablasCreadas++;

                // 9. coordinadores
                await execSQL(`CREATE TABLE IF NOT EXISTS coordinadores (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    usuario_id INTEGER UNIQUE NOT NULL,
                    carrera_id INTEGER NOT NULL,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME,
                    FOREIGN KEY (usuario_id) REFERENCES usuarios(id),
                    FOREIGN KEY (carrera_id) REFERENCES carreras(id)
                );`); tablasCreadas++;

                // 10. directivos
                await execSQL(`CREATE TABLE IF NOT EXISTS directivos (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    usuario_id INTEGER UNIQUE NOT NULL,
                    entidad_id INTEGER NOT NULL,
                    cargo TEXT,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME,
                    FOREIGN KEY (usuario_id) REFERENCES usuarios(id),
                    FOREIGN KEY (entidad_id) REFERENCES entidades(id)
                );`); tablasCreadas++;

                // 11. planes_superacion
                await execSQL(`CREATE TABLE IF NOT EXISTS planes_superacion (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    egresado_id INTEGER NOT NULL,
                    tutor_id INTEGER,
                    coordinador_id INTEGER,
                    anio_plan INTEGER NOT NULL,
                    estado TEXT DEFAULT 'activo',
                    progreso INTEGER DEFAULT 0,
                    fecha_inicio DATE,
                    fecha_fin_estimada DATE,
                    fecha_fin_real DATE,
                    observaciones TEXT,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME,
                    FOREIGN KEY (egresado_id) REFERENCES egresados(id),
                    FOREIGN KEY (tutor_id) REFERENCES tutores(id),
                    FOREIGN KEY (coordinador_id) REFERENCES coordinadores(id)
                );`); tablasCreadas++;

                // 12. acciones_plan
                await execSQL(`CREATE TABLE IF NOT EXISTS acciones_plan (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    plan_id INTEGER NOT NULL,
                    titulo TEXT NOT NULL,
                    descripcion TEXT,
                    tipo TEXT,
                    estado TEXT DEFAULT 'pendiente',
                    fecha_programada DATE,
                    fecha_limite DATE,
                    fecha_completado DATE,
                    recursos TEXT,
                    icono TEXT,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME,
                    FOREIGN KEY (plan_id) REFERENCES planes_superacion(id)
                );`); tablasCreadas++;

                // 13. tutorias
                await execSQL(`CREATE TABLE IF NOT EXISTS tutorias (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    egresado_id INTEGER NOT NULL,
                    tutor_id INTEGER NOT NULL,
                    fecha DATE NOT NULL,
                    resumen TEXT NOT NULL,
                    acuerdos TEXT,
                    proxima_tutoria DATE,
                    estado TEXT DEFAULT 'solicitada',
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME,
                    FOREIGN KEY (egresado_id) REFERENCES egresados(id),
                    FOREIGN KEY (tutor_id) REFERENCES tutores(id)
                );`); tablasCreadas++;

                // 14. evaluaciones
                await execSQL(`CREATE TABLE IF NOT EXISTS evaluaciones (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    egresado_id INTEGER NOT NULL,
                    tutor_id INTEGER,
                    tipo TEXT,
                    dimension TEXT,
                    puntaje INTEGER CHECK (puntaje BETWEEN 1 AND 5),
                    comentario TEXT,
                    fecha DATE,
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    FOREIGN KEY (egresado_id) REFERENCES egresados(id),
                    FOREIGN KEY (tutor_id) REFERENCES tutores(id)
                );`); tablasCreadas++;

                // 15. evidencias
                await execSQL(`CREATE TABLE IF NOT EXISTS evidencias (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    egresado_id INTEGER NOT NULL,
                    tipo TEXT,
                    titulo TEXT NOT NULL,
                    descripcion TEXT,
                    archivo TEXT,
                    url TEXT,

        // ============================================================

        async function limpiarYRecrearBD() {
            if (!isReady) { setStatus('SQLite no inicializado', 'error'); return; }

            if (!confirm('⚠️ ¿Estás seguro de que quieres LIMPIAR Y RECREAR toda la base de datos?\n\nEsta acción:')) {
                return;
            }
            if (!confirm('⚠️ 1. Eliminará TODAS las tablas existentes')) {
                return;
            }
            if (!confirm('⚠️ 2. Creará 30 tablas nuevas')) {
                return;
            }
            if (!confirm('⚠️ 3. Insertará 29 entidades, 7 carreras, 24 investigadores, 11 objetivos y más datos\n\n¿Confirmas?')) {
                return;
            }

            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'separator');
            log('⚠️ INICIANDO LIMPIEZA Y RECREACIÓN DE BD', 'warning');
            await crearBDCompleta(true);
        }

        // ============================================================
        // VERIFICAR BD
        // ============================================================
        async function verificarBD() {
            if (!isReady) { setStatus('SQLite no inicializado', 'error'); return; }

            setStatus('Verificando base de datos...', 'loading');
            log('🔍 Verificando base de datos...', 'info');

            try {
                const tablas = ['roles', 'usuarios', 'entidades', 'carreras', 'docentes', 'tutores', 'egresados', 'competencias', 'cursos', 'eventos', 'objetivos_proyecto', 'dimensiones_evaluacion'];
                let html = '';
                let totalRegistros = 0;

                for (const tabla of tablas) {
                    try {
                        const result = await querySQL(`SELECT COUNT(*) as total FROM ${tabla}`);
                        const count = result[0]?.total || 0;
                        totalRegistros += count;
                        html += `<tr>
                            <td><strong>${tabla}</strong></td>
                            <td style="text-align:right;"><span class="badge badge-info">${count}</span></td>
                        </tr>`;
                        log(`   📊 ${tabla}: ${count} registros`, 'info');
                    } catch (e) {
                        html += `<tr>
                            <td><strong>${tabla}</strong></td>
                            <td style="text-align:right;"><span class="badge badge-danger">❌</span></td>
                        </tr>`;
                        log(`   ❌ ${tabla}: no existe`, 'error');
                    }
                }

                // Agregar total
                html += `<tr style="background:#f1f5f9;font-weight:700;">
                    <td><i class="fas fa-calculator"></i> <strong>TOTAL</strong></td>
                    <td style="text-align:right;"><span class="table-count">${totalRegistros}</span></td>
                </tr>`;

                document.getElementById('tabla-resultados').innerHTML = html;
                document.getElementById('resultados').style.display = 'block';

                // Verificar específicamente las entidades
                const entidades = await querySQL('SELECT COUNT(*) as total FROM entidades');
                log(`🏢 Entidades totales: ${entidades[0]?.total || 0}`, 'info');

                if (entidades[0]?.total === 29) {
                    log('✅ Todas las 29 entidades están presentes', 'ok');
                }

                // Verificar carreras
                const carreras = await querySQL('SELECT COUNT(*) as total FROM carreras');
                log(`🎓 Carreras totales: ${carreras[0]?.total || 0}`, 'info');

                if (carreras[0]?.total === 7) {
                    log('✅ Las 7 carreras del proyecto están presentes', 'ok');
                }

                // Verificar investigadores
                const investigadores = await querySQL('SELECT COUNT(*) as total FROM docentes WHERE es_investigador_proyecto = 1');
                log(`👨‍🏫 Investigadores del proyecto: ${investigadores[0]?.total || 0}`, 'info');

                if (investigadores[0]?.total === 24) {
                    log('✅ Los 24 investigadores del proyecto están presentes', 'ok');
                }

                // Verificar objetivos
                const objetivos = await querySQL('SELECT COUNT(*) as total FROM objetivos_proyecto');
                log(`🎯 Objetivos del proyecto: ${objetivos[0]?.total || 0}`, 'info');

                if (objetivos[0]?.total === 11) {
                    log('✅ Los 11 objetivos del proyecto están presentes', 'ok');
                }

                setStatus(`✅ Verificación: ${totalRegistros} registros en ${tablas.length} tablas`, 'success');

            } catch (error) {
                log(`❌ ERROR al verificar: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================================
        // DESCARGAR BD
        // ============================================================
        function descargarBD() {
            if (!isReady || !db) { setStatus('SQLite no inicializado', 'error'); return; }

            try {
                const data = db.export();
                const blob = new Blob([data], { type: 'application/x-sqlite3' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sispe.db';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                log('📥 Archivo sispe.db descargado correctamente', 'ok');
                setStatus('✅ Base de datos descargada', 'success');
            } catch (error) {
                log(`❌ Error al descargar: ${error.message}`, 'error');
                setStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

            }
        }

        document.addEventListener('DOMContentLoaded', init);
