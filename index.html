    <style>
        /* ============================================================
           ESTILOS ADICIONALES
           ============================================================ */
        
        .badge-multi {
            background: #f687b3;
            color: #702459;
            animation: pulse-badge 2s infinite;
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn-floating-home {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: #0a1e3c;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(10, 30, 60, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
        }

        .btn-floating-home:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(10, 30, 60, 0.5);
        }

        .historial-tutorias-container {
            margin-top: 16px;
        }

        .historial-item {
            padding: 12px 16px;
            border-left: 4px solid #2a6b9c;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
            margin-bottom: 8px;
        }

        .historial-item.solicitud {
            border-left-color: #d48a2a;
        }

        .historial-item.respuesta {
            border-left-color: #1a8a4a;
        }

        .historial-item .fecha {
            font-size: 12px;
            color: #94a3b8;
        }

        .historial-item .mensaje {
            font-size: 14px;
            color: #475569;
        }

        /* Soporte para emojis en toda la aplicación */
        * {
            font-family: 'Inter', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Android Emoji', 'EmojiSymbols', sans-serif;
        }

        .logo-cell, .emoji-display, .stat-icon, .menu-item .icon {
            font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Android Emoji', 'EmojiSymbols', sans-serif;
        }
    </style>

    <!-- ============================================================ -->
    <!-- REGISTRO DE SERVICE WORKER -->
    <!-- ============================================================ -->
    <script>
        (function() {
            console.log('🔧 SISPE - Registrando Service Worker...');
            
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    fetch('sw.js')
                        .then(function(response) {
                            if (response.ok) {
                                console.log('✅ sw.js encontrado. Registrando...');
                                return navigator.serviceWorker.register('sw.js', {
                                    scope: '/sispe/'
                                });
                            } else {
                                throw new Error('sw.js no encontrado (status: ' + response.status + ')');
                            }
                        })
                        .then(function(reg) {
                            console.log('✅ Service Worker registrado correctamente');
                            console.log('📋 Scope:', reg.scope);
                            console.log('📋 Estado:', reg.active ? 'Activo' : 'Instalando...');
                            
                            if (reg.waiting) {
                                console.log('🔄 Activando actualización...');
                                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                            }
                            
                            if (!reg.active) {
                                setTimeout(function() {
                                    window.location.reload();
                                }, 1000);
                            }
                        })
                        .catch(function(err) {
                            console.error('❌ Error al registrar Service Worker:', err);
                            console.log('💡 Verifica que sw.js esté en la raíz del proyecto');
                        });
                });
            } else {
                console.warn('⚠️ Service Worker no soportado en este navegador');
            }
        })();
    </script>
